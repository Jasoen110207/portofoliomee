<!-- PROJECTS MODAL: dibuka via Snapshot Bar / sidebar. Data project diambil otomatis dari Supabase (tabel "projects") oleh snapshot-projects.js. Tambah project baru = tinggal INSERT row baru di Supabase, tidak perlu edit file ini. -->
<div id="project-modal-overlay" class="hidden fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm items-center justify-center p-4">
    <div id="project-modal-panel" class="w-full max-w-3xl max-h-[85vh] bg-[#fcfcfd] dark:bg-zinc-950 rounded-3xl border border-zinc-200 dark:border-zinc-800 shadow-2xl flex flex-col overflow-hidden">
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-100 dark:border-zinc-800 shrink-0">
            <h2 class="text-xl font-extrabold text-zinc-900 dark:text-zinc-100" data-i18n="title_projects">Projects</h2>
            <button type="button" id="project-modal-close" aria-label="Close" class="w-8 h-8 flex items-center justify-center rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Body: scrollable, aman meski project bertambah banyak -->
        <div class="p-6 overflow-y-auto">
            <div id="projects-grid" class="space-y-8">
                <!-- Diisi otomatis oleh snapshot-projects.js dari tabel Supabase "projects" -->
            </div>
        </div>
    </div>
</div>
