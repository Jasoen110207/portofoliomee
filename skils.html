<!-- SKILLS MODAL: dibuka via Snapshot Bar / sidebar. Data skill diambil otomatis dari Supabase (tabel "skils") oleh snapshot-skills.js, ditampilkan sebagai grid icon+nama. Tambah skill baru = tinggal INSERT row baru di Supabase (kolom name, icon = class Font Awesome), tidak perlu edit file ini. -->
<div id="skills-modal-overlay" class="hidden fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm items-center justify-center p-4">
    <div id="skills-modal-panel" class="w-full max-w-3xl max-h-[85vh] bg-[#fcfcfd] dark:bg-zinc-950 rounded-3xl border border-zinc-200 dark:border-zinc-800 shadow-2xl flex flex-col overflow-hidden">
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-100 dark:border-zinc-800 shrink-0">
            <h2 class="text-xl font-extrabold text-zinc-900 dark:text-zinc-100" data-i18n="title_skills">Technical Skills</h2>
            <button type="button" id="skills-modal-close" aria-label="Close" class="w-8 h-8 flex items-center justify-center rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Body: grid icon skill, aman meski skill bertambah banyak -->
        <div class="p-6 overflow-y-auto">
            <div id="skills-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-4">
                <!-- Diisi otomatis oleh snapshot-skills.js dari tabel Supabase "skils" -->
            </div>
        </div>
    </div>
</div>
