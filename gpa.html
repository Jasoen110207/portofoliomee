<!-- GPA MODAL -->
<div
    id="gpa-modal-overlay"
    class="hidden fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm items-center justify-center p-4"
>
    <div
        id="gpa-modal-panel"
        class="w-full max-w-3xl max-h-[85vh] bg-[#fcfcfd] dark:bg-zinc-950 rounded-3xl border border-zinc-200 dark:border-zinc-800 shadow-2xl flex flex-col overflow-hidden"
    >

        <!-- Modal Header -->
        <div
            class="flex items-center justify-between px-6 py-4 border-b border-zinc-100 dark:border-zinc-800 shrink-0"
        >
            <h2
                class="text-xl font-extrabold text-zinc-900 dark:text-zinc-100"
                data-i18n="title_gpa"
            >
                Academic Results (KHS)
            </h2>

            <button
                type="button"
                id="gpa-modal-close"
                aria-label="Close"
                class="w-8 h-8 flex items-center justify-center rounded-full text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto">

            <!-- Loading -->
            <div
                id="gpa-loading"
                class="flex items-center justify-center py-12 text-zinc-500"
            >
                <div class="text-center">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                    <p class="text-sm">Memuat data KHS...</p>
                </div>
            </div>

            <!-- Grid KHS -->
            <div
                id="gpa-grid"
                class="hidden grid grid-cols-2 gap-5"
            ></div>

            <!-- Empty -->
            <div
                id="gpa-empty"
                class="hidden text-center py-12 text-zinc-500"
            >
                <i class="fa-solid fa-graduation-cap text-3xl mb-3"></i>
                <p class="text-sm">Belum ada data KHS.</p>
            </div>

            <!-- Error -->
            <div
                id="gpa-error"
                class="hidden text-center py-12 text-red-500"
            >
                <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>
                <p class="text-sm">Gagal memuat data KHS.</p>
            </div>

        </div>
    </div>
</div>
